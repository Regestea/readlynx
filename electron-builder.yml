appId: com.readlynx.app
productName: ReadLynx
copyright: Copyright (c) 2026 Regestea. Licensed under BUSL-1.1

directories:
  output: release
  # Icon sources (app icon + per-type file icons) live here. electron-builder
  # resolves association icons from this dir.
  buildResources: src/assets/icon

# "Open with ReadLynx" (double-click). Association icons are picked
# automatically by extension basename: `${firstExt}.ico` on Windows (NSIS)
# and `${firstExt}.icns` on macOS (pdf/epub/md files above).
# Linux has no per-extension hook: icons go by MIME type instead — the deb
# installs `application-pdf` / `application-epub+zip` / `text-markdown` into
# the system hicolor tree via `deb.fpm`, and the AppImage copies the same
# set into `~/.local/share/icons` on first run (electron/main.ts).
fileAssociations:
  - ext: pdf
    name: com.readlynx.app.pdf
    description: PDF Document (ReadLynx)
    mimeType: application/pdf
    role: Viewer
  - ext: epub
    name: com.readlynx.app.epub
    description: EPUB Book (ReadLynx)
    mimeType: application/epub+zip
    role: Viewer
  - ext:
      - md
      - markdown
    name: com.readlynx.app.markdown
    description: Markdown Document (ReadLynx)
    mimeType: text/markdown
    role: Viewer

files:
  - dist/**
  - electron/**
  - src/**
  - package.json
  # Build-time icon binaries (embedded into the installer / app bundle by
  # electron-builder itself) — no need to ship them inside the app.
  - "!src/assets/icon/*.ico"
  - "!src/assets/icon/*.icns"
  - "!src/assets/icon/icons"

# Native modules (better-sqlite3) and the worker threads that use them
# must live outside the asar archive.
asarUnpack:
  - "**/*.node"
  - "electron/**"
  - "src/**"

win:
  icon: src/assets/icon/app-icon.png
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ReadLynx

mac:
  icon: src/assets/icon/app-icon.png
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  # A directory of pre-sized PNGs (not the single 1024px source): the deb and
  # AppImage embed every size into the hicolor tree, so taskbars and app
  # menus get a crisp icon instead of a runtime downscale of one 1024px image.
  icon: src/assets/icon/icons
  # Electron reports the app id / WM_CLASS from `desktopName` in package.json
  # ("ReadLynx.desktop"). Desktop environments match that against the INSTALLED
  # .desktop file NAME — on Wayland (GNOME/KDE default) a mismatch means a
  # generic taskbar icon for the running app even though the icon files are
  # installed. `syncDesktopName` names the .desktop file accordingly.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Office
  synopsis: A modern reading app

# Per-file-type icons for file managers. Icon names derive from the MIME
# types handled above (application/pdf → application-pdf, etc.) and land in
# the standard hicolor `mimetypes` sizes. These mappings only apply to the
# deb target; the AppImage relies on the first-run copy in electron/main.ts
# because a file manager reads the host's icon dirs, never the mounted image.
# electron-builder 26 only accepts `fpm` on target-level configs (deb/rpm/
# pacman), not under `linux`; the deb target merges this block over `linux`.
deb:
  # Stock defaults plus libasound2 + libgbm1, which Electron loads at startup
  # but electron-builder's default depends list omits — on a minimal Ubuntu a
  # clean install would otherwise leave the app dying with
  # "error while loading shared libraries". The t64-renamed packages on
  # 24.04+ provide these legacy names, so one list covers all releases.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    - libgbm1
  # Postinst override: force chrome-sandbox to SUID 4755. See the header of
  # build/after-install.sh — on Ubuntu 23.10+ the stock conditional chmod
  # leaves it 0755 and leans on the AppArmor profile, which can silently fail
  # to install; the SUID helper works under every userns policy.
  afterInstall: build/after-install.sh
  fpm:
    - src/assets/icon/mime/application-pdf.128.png=/usr/share/icons/hicolor/128x128/mimetypes/application-pdf.png
    - src/assets/icon/mime/application-pdf.256.png=/usr/share/icons/hicolor/256x256/mimetypes/application-pdf.png
    - src/assets/icon/mime/application-pdf.512.png=/usr/share/icons/hicolor/512x512/mimetypes/application-pdf.png
    - src/assets/icon/mime/application-epub+zip.128.png=/usr/share/icons/hicolor/128x128/mimetypes/application-epub+zip.png
    - src/assets/icon/mime/application-epub+zip.256.png=/usr/share/icons/hicolor/256x256/mimetypes/application-epub+zip.png
    - src/assets/icon/mime/application-epub+zip.512.png=/usr/share/icons/hicolor/512x512/mimetypes/application-epub+zip.png
    - src/assets/icon/mime/text-markdown.128.png=/usr/share/icons/hicolor/128x128/mimetypes/text-markdown.png
    - src/assets/icon/mime/text-markdown.256.png=/usr/share/icons/hicolor/256x256/mimetypes/text-markdown.png
    - src/assets/icon/mime/text-markdown.512.png=/usr/share/icons/hicolor/512x512/mimetypes/text-markdown.png