appId: com.readlynx.app
productName: ReadLynx
copyright: Copyright (c) 2026 ReadLynx Contributors

directories:
  output: release

files:
  - dist/**
  - electron/**
  - src/**
  - package.json

# Native modules (better-sqlite3) and the worker threads that use them
# must live outside the asar archive.
asarUnpack:
  - "**/*.node"
  - "electron/**"
  - "src/**"

win:
  icon: src/assets/icon/app-icon.png
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ReadLynx

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  icon: src/assets/icon/app-icon.png
  target:
    - AppImage
    - deb
  category: Office
  synopsis: A modern reading app